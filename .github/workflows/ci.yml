# Lint, format, dead-code, type, and test checks on every platform AMORA
# supports (PRD §15). Actions are pinned to commit SHAs so a moved tag cannot
# change what runs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            evals/projects/notes-app/package-lock.json
      - run: npm ci
      # The realistic benchmark tier checks its briefs against a React app with
      # real dependencies, which are not committed.
      - run: npm ci --prefix evals/projects/notes-app
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      # The same run as npm test, plus annotations for failing tests, which can
      # be read on the run's checks without access to the job log.
      - run: >-
          node --test --test-force-exit
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./test/github-annotations.ts --test-reporter-destination=stdout
          "test/**/*.test.ts"
      - name: CLI starts
        run: |
          node src/cli/main.ts --version
          node src/cli/main.ts --help
