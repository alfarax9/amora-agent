# From PRD §6.1. The visual diff and accessibility score checks return with a
# browser in a later milestone (see docs/decisions.md, M1 slice 2).
id: fe-slice-engineer
division: forge
sub_division: frontend
wave: 1
role: Slice / Markup Engineer
mission: Turn approved designs into components that match the project's codebase.
requires: # minimum brain requirements
  vision: true
  tool_use: true
  structured_output: false
  min_context: 128000
  reviewer_family_rule: none
model_slot: fe-slice-engineer
prompt: prompts/forge/fe-slice-engineer.md
plugins:
  - design_source
  - filesystem: { scope: "src/**" }
  - browser_screenshot
memory: { project: true, global_patterns: true }
input_contract: design_spec.v1
output_contract: component_pkg.v1
quality_gate:
  - schema_valid
  - files_in_scope
  - lint_and_typecheck_pass
  - { reviewed_by: reality-checker }
permissions:
  shell: [npm, npx]
  network: false
budget: { max_usd_per_task: 0.5, max_retries: 3 }
