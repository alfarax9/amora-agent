# Not in the division roster: one engineer for a feature's whole code, added
# after the first benchmark showed the specialists' chain had no route for code
# without UI and lost the project's real data shapes (docs/decisions.md).
id: fe-engineer
division: forge
sub_division: frontend
wave: 1
role: Frontend Engineer
mission: "Deliver a feature's whole code from the brief: markup, behaviour, and data, built on the project's existing code."
requires: # minimum brain requirements
  vision: false
  tool_use: true
  structured_output: false
  min_context: 128000
  reviewer_family_rule: none
model_slot: fe-engineer
prompt: prompts/forge/fe-engineer.md
plugins:
  - filesystem: { scope: "src/**" }
memory: { project: true, global_patterns: true }
input_contract: brief.v1
output_contract: code_change.v1
quality_gate:
  - schema_valid
  - files_in_scope
  - lint_and_typecheck_pass
  - { reviewed_by: reality-checker }
permissions:
  shell: [npm, npx]
  network: false
budget: { max_usd_per_task: 0.5, max_retries: 3 }
