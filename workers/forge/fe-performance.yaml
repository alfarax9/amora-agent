id: fe-performance
division: forge
sub_division: frontend
wave: 1
role: Performance & Optimization
mission: "Keep the feature fast: bundle size, rendering work, and loading order, without changing behaviour."
requires: # minimum brain requirements
  vision: false
  tool_use: true
  structured_output: false
  min_context: 128000
  reviewer_family_rule: none
model_slot: fe-performance
prompt: prompts/forge/fe-performance.md
plugins:
  - filesystem: { scope: "src/**" }
memory: { project: true, global_patterns: true }
input_contract: code_change.v1
output_contract: code_change.v1
quality_gate:
  - schema_valid
  - files_in_scope
  - lint_and_typecheck_pass
  - { reviewed_by: reality-checker }
permissions:
  shell: [npm, npx]
  network: false
budget: { max_usd_per_task: 0.4, max_retries: 3 }
